name: CI
on: [push, pull_request]
env:
  GUI_DEPS: libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: sudo apt-get update && sudo apt-get install -y $GUI_DEPS
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with: { name: nirusec, path: target/release/nirusec, retention-days: 3 }

  msrv:
    # Declared rust-version and Debian 13's rustc.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: sudo apt-get update && sudo apt-get install -y $GUI_DEPS
      - run: cargo build --locked --release
      - run: cargo test --locked

  firewall-netns:
    # Real UFW + the root helper in a private network/mount namespace.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: nirusec, path: bin }
      - run: sudo apt-get update && sudo apt-get install -y ufw iproute2 python3
      - run: chmod +x bin/nirusec && sudo tests/netns/run.sh bin/nirusec

  gui-xvfb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: nirusec, path: bin }
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick libxkbcommon-x11-0 libgl1 libegl1 libgl1-mesa-dri
      - run: chmod +x bin/nirusec && tests/gui/run-xvfb.sh bin/nirusec shots
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: shots, retention-days: 7 }
