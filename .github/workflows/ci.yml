name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      # The netns job needs the binary; kept for one day.
      - uses: actions/upload-artifact@v4
        with: { name: nirusec, path: target/release/nirusec, retention-days: 1 }

  msrv:
    # Declared rust-version and Debian 13's rustc.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build --locked --release
      - run: cargo test --locked

  firewall-netns:
    # Real UFW + the root helper in a private network/mount namespace.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: nirusec, path: bin }
      - run: sudo apt-get update && sudo apt-get install -y ufw iproute2 python3
      - run: chmod +x bin/nirusec && sudo tests/netns/run.sh bin/nirusec

  gui-xvfb:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: nirusec, path: bin }
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool imagemagick fonts-dejavu-core python3
      - run: chmod +x bin/nirusec && tests/xvfb.sh bin/nirusec
      - run: tests/gui/run-xvfb.sh bin/nirusec shots
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: screenshots, path: shots, retention-days: 1 }
