name: Release
on:
  push: { tags: ['v*'] }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy", targets: x86_64-unknown-linux-musl }
      - run: sudo apt-get update && sudo apt-get install -y musl-tools xvfb xdotool fonts-dejavu-core python3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # A static binary: runs on Debian, Arch and Void without GUI libraries.
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Identity
        run: test "$(./target/x86_64-unknown-linux-musl/release/nirusec --version | awk '{print $2}')" = "${GITHUB_REF_NAME#v}"
      - name: End-to-end GUI test
        run: tests/xvfb.sh target/x86_64-unknown-linux-musl/release/nirusec
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/nirusec install.sh uninstall.sh dist/
          cp -R assets dist/
          printf '%s\n' "${GITHUB_REF_NAME#v}" > dist/VERSION
          (cd dist && sha256sum nirusec install.sh uninstall.sh VERSION assets/* > SHA256SUMS)
          (cd dist && tar -czf "nirusec-${GITHUB_REF_NAME#v}-x86_64-linux-musl.tar.gz" nirusec VERSION install.sh uninstall.sh assets SHA256SUMS)
          cd dist && sha256sum nirusec *.tar.gz install.sh uninstall.sh VERSION assets/* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            dist/nirusec
            dist/nirusec-*-x86_64-linux-musl.tar.gz
            dist/install.sh
            dist/uninstall.sh
            dist/VERSION
            dist/assets/*
            dist/SHA256SUMS
          generate_release_notes: true
