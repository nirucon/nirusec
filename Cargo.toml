[package]
name = "nirusec"
version = "0.1.7"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "NIRUX security, firewall, update and firmware GUI"
repository = "https://github.com/nirucon/nirusec"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.29.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

[[bin]]
name = "nirusec"
path = "src/main.rs"


[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
