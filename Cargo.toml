[package]
name = "nirusec"
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "NIRUX security, firewall, update and firmware GUI"
repository = "https://github.com/nirucon/nirusec"

[dependencies]
x11rb = { version = "0.13", features = ["shm"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

[[bin]]
name = "nirusec"
path = "src/main.rs"


[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
